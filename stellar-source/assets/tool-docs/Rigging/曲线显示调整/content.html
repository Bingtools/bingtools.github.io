<h1>曲线显示调整</h1>
<h2>工具具体功能</h2><ul>
<li>调整所选 NURBS 控制器曲线的视口线宽。</li>
<li>设置控制器显示颜色并启用对象显示覆盖。</li>
<li>支持取消颜色覆盖并恢复 Maya 默认显示。</li>
</ul><h2>工具使用教程</h2><ol>
<li>选择一个或多个 NURBS 控制器曲线。</li>
<li>点击刷新选中曲线。</li>
<li>设置线宽并点击应用线宽。</li>
<li>选择颜色，勾选开启显示覆盖并点击应用颜色。</li>
<li>需要恢复默认颜色时点击取消覆盖。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">颜色显示需要启用对象 override。</li>
<li class="tip">该工具改变的是视口显示属性，不会修改渲染材质。</li>
</ul></body></html>
