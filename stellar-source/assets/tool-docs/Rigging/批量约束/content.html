<h1>批量约束</h1>
<h2>工具具体功能</h2><ul>
<li>批量创建 Parent、Point、Orient 等常用约束。</li>
<li>支持一对一和一对多匹配。</li>
<li>可选择保持偏移，并支持删除选中对象上的约束。</li>
</ul><h2>工具使用教程</h2><ol>
<li>将驱动对象添加到约束对列表。</li>
<li>将被驱动对象添加到被约束列表。</li>
<li>选择约束类型和一对一或一对多模式。</li>
<li>根据需要勾选保持偏移。</li>
<li>点击执行约束并测试结果。</li>
<li>需要清理时选择对象并点击删除选中约束。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">一对一模式下两侧数量应一致。</li>
<li class="tip">删除约束前确认选中对象，避免清理其他绑定关系。</li>
</ul></body></html>
