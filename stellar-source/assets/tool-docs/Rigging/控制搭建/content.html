<h1>控制搭建</h1>
<h2>工具具体功能</h2><ul>
<li>创建和管理绑定使用的 NURBS 控制器。</li>
<li>支持控制器形状、颜色、尺寸、方向和层级设置。</li>
<li>提供常用控制器整理和匹配操作。</li>
</ul><h2>工具使用教程</h2><ol>
<li>选择需要添加控制器的关节或对象。</li>
<li>打开工具并选择控制器形状。</li>
<li>设置尺寸、颜色和朝向。</li>
<li>执行创建并确认 Offset 组和父子层级。</li>
<li>测试控制器变换和约束关系。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">创建前确认对象轴向和变换状态。</li>
<li class="tip">绑定完成后不要随意冻结已有控制器变换。</li>
</ul></body></html>
