<h1>批量对齐</h1>
<h2>工具具体功能</h2><ul>
<li>批量匹配对象的位置和旋转。</li>
<li>支持一对一与一对多匹配。</li>
<li>可分别指定位置轴、旋转轴，并支持按指定轴等距分布。</li>
</ul><h2>工具使用教程</h2><ol>
<li>选择对象后将其添加到对齐对列表和对齐目标列表。</li>
<li>选择一对一或一对多匹配模式。</li>
<li>勾选需要对齐的位置轴和旋转轴。</li>
<li>点击位置对齐、旋转对齐或全对齐。</li>
<li>需要规则排列时选择等距分布轴并执行。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">一对一模式要求两侧对象数量对应。</li>
<li class="tip">约束或锁定通道可能阻止部分轴向对齐。</li>
</ul></body></html>
