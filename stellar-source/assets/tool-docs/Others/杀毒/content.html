<h1>Maya 场景杀毒</h1>
<h2>工具具体功能</h2><ul>
<li>扫描常见 Maya 恶意脚本、异常 scriptNode 和启动项。</li>
<li>辅助清理场景及用户脚本目录中的已知风险内容。</li>
<li>提供扫描结果，便于在保存前确认清理范围。</li>
</ul><h2>工具使用教程</h2><ol>
<li>保存当前场景副本。</li>
<li>打开工具并执行扫描。</li>
<li>查看检测到的异常节点、脚本或文件。</li>
<li>确认后执行清理。</li>
<li>重新打开场景并再次扫描，确认风险项已消失。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">不要将正常项目脚本误判后直接删除，先核对路径和内容。</li>
<li class="tip">严重感染时应同时检查用户 Maya scripts 目录和团队共享脚本。</li>
</ul></body></html>
