<h1>平滑曲线</h1>
<h2>工具具体功能</h2><ul>
<li>对选中的动画曲线或关键帧进行平滑处理。</li>
<li>提供不同强度和算法参数，用于减少抖动与噪点。</li>
<li>适合动捕清理、摄像机动画和控制器曲线优化。</li>
</ul><h2>工具使用教程</h2><ol>
<li>在 Graph Editor 中选择需要处理的动画曲线或关键帧。</li>
<li>打开工具并选择平滑方式。</li>
<li>从较小强度开始调整参数。</li>
<li>预览或执行平滑。</li>
<li>对比处理前后的动作节奏，必要时撤销并降低强度。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">过高平滑强度会损失动作细节和极值。</li>
<li class="tip">建议只选择存在噪点的通道和时间范围。</li>
</ul></body></html>
