<h1><span class="tag">FB</span>快速烘焙</h1>
<p>把所选对象在指定时间范围内的驱动结果烘焙为普通关键帧。作者：Bingo。</p>
<ol><li>选择需要烘焙的控制器或物体。</li><li>可在时间轴拖选范围；未拖选时使用当前播放范围。</li><li>单击图标，在菜单中选择每 1～7 帧采样一次。</li></ol>
<ul><li>通道盒有选中属性时，仅烘焙这些属性。</li><li>保留范围外原有关键帧。</li><li>不会主动删除原有约束。</li></ul>
<p class="note">整次操作支持 Ctrl+Z。高采样步长会减少关键帧，但也可能损失快速动作细节。</p>
</body></html>
