<h1><span class="tag">SK</span>平滑所选关键帧</h1>
<p>降低动画曲线中的局部抖动，同时尽量保持整体运动趋势。作者：Bingo。</p>
<ol><li>在曲线编辑器中选中需要处理的关键帧。</li><li>单击图标，工具以 50% 强度平滑一次。</li></ol>
<ul><li>只修改选中的内部关键帧。</li><li>曲线首尾关键帧保持不变。</li><li>按相邻关键帧的时间距离计算，不要求等间距。</li></ul>
<p class="note">整次操作支持 Ctrl+Z。没有选中关键帧时，工具不会修改动画。</p>
</body></html>
