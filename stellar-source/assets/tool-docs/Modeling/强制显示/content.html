<h1>强制显示</h1>
<h2>工具具体功能</h2><ul>
<li>恢复因 visibility、父级或显示覆盖导致不可见的对象。</li>
<li>可批量处理选择层级中的显示状态。</li>
<li>用于排查模型存在但视口无法看到的问题。</li>
</ul><h2>工具使用教程</h2><ol>
<li>在 Outliner 中选择不可见对象或其父级。</li>
<li>打开工具并选择需要恢复的显示范围。</li>
<li>执行强制显示。</li>
<li>检查父级 visibility、显示层和对象覆盖是否已恢复。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">强制显示可能改变原有动画或显示层设计，执行前确认用途。</li>
<li class="tip">引用资产的锁定属性可能无法直接修改。</li>
</ul></body></html>
