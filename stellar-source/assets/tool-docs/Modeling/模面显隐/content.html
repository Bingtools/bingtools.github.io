<h1>模面显隐</h1>
<h2>工具具体功能</h2><ul>
<li>对模型选定面进行快速隐藏与恢复。</li>
<li>用于临时查看模型内部、处理遮挡或局部建模。</li>
<li>提供集中恢复功能，减少手动查找隐藏组件。</li>
</ul><h2>工具使用教程</h2><ol>
<li>进入组件模式并选择需要隐藏的多边形面。</li>
<li>打开工具并执行隐藏所选面。</li>
<li>继续建模或检查内部结构。</li>
<li>需要恢复时选择对应模型并执行显示或恢复全部。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">隐藏是场景显示状态，不等于删除几何体。</li>
<li class="tip">导出或交付前建议恢复并检查所有隐藏面。</li>
</ul></body></html>
