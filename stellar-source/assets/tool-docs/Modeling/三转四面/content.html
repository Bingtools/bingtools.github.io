<h1>三角面转四边面</h1>
<h2>工具具体功能</h2><ul>
<li>尝试将选中模型中的相邻三角面合并为四边面。</li>
<li>支持按拓扑条件批量处理，提高模型整理效率。</li>
<li>适合导入模型或三角化模型的初步拓扑清理。</li>
</ul><h2>工具使用教程</h2><ol>
<li>选择需要处理的多边形模型或局部三角面。</li>
<li>打开工具并设置处理范围。</li>
<li>执行三转四面。</li>
<li>检查轮廓、UV、法线和变形区域。</li>
<li>对不理想区域撤销后手动整理。</li>
</ol><h2>注意事项</h2><ul>
<li class="tip">并非所有三角面都能合理组成四边面。</li>
<li class="tip">绑定模型处理前应保存副本，并检查蒙皮、UV 和法线是否受影响。</li>
</ul></body></html>
